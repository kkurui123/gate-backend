services:
  - type: web
    name: gate-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "postgresql+asyncpg://neondb_owner:YOUR_PASSWORD@gate-db--.neon.tech:5432/gate_db?ssl=require"   